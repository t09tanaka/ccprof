name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-and-integration-matrix:
    name: unit-and-integration-tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node tools/smoke-better-sqlite3.cjs
      - run: npm test

  arm64-native-smoke:
    name: arm64-native-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e 'if (process.arch !== "arm64") process.exit(1)'
      - run: node tools/smoke-better-sqlite3.cjs

  unit-and-integration-tests:
    name: unit-and-integration-tests
    needs: [unit-and-integration-matrix, arm64-native-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MATRIX_RESULT: ${{ needs.unit-and-integration-matrix.result }}
      ARM64_RESULT: ${{ needs.arm64-native-smoke.result }}
    steps:
      - name: Require every blocking runtime lane
        run: |
          if [ "$MATRIX_RESULT" != "success" ] || [ "$ARM64_RESULT" != "success" ]; then
            exit 1
          fi

  node26-canary:
    name: node26-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node tools/smoke-better-sqlite3.cjs
      - run: npm run typecheck
      - run: npm test

  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          mkdir -p "$RUNNER_TEMP/ccprof-pack" "$RUNNER_TEMP/ccprof-prefix"
          npm pack --pack-destination "$RUNNER_TEMP/ccprof-pack"
          npm install --global --prefix "$RUNNER_TEMP/ccprof-prefix" "$RUNNER_TEMP/ccprof-pack"/*.tgz
          "$RUNNER_TEMP/ccprof-prefix/bin/ccprof" --version
          "$RUNNER_TEMP/ccprof-prefix/bin/ccprof" --help
          mkdir -p "$RUNNER_TEMP/ccprof-smoke-repo" "$RUNNER_TEMP/ccprof-smoke-data"
          git -C "$RUNNER_TEMP/ccprof-smoke-repo" init
          (
            cd "$RUNNER_TEMP/ccprof-smoke-repo"
            CCPROF_DATA_DIR="$RUNNER_TEMP/ccprof-smoke-data" \
              "$RUNNER_TEMP/ccprof-prefix/bin/ccprof" stats --privacy strict --json \
              > "$RUNNER_TEMP/ccprof-stats.json"
          )
          node -e '
            const fs = require("node:fs");
            const stats = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (stats.history_count !== 0) process.exit(1);
          ' "$RUNNER_TEMP/ccprof-stats.json"
          test "$(find "$RUNNER_TEMP/ccprof-smoke-data" -type f -name store.sqlite3 -print | wc -l)" -eq 1

  determinism-golden:
    name: determinism-golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:test
      - run: node --test .test-dist/test/determinism-golden.test.js
